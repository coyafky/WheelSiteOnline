server {
    listen 7080;
    listen [::]:7080;
    server_name 119.91.205.130;

    access_log /var/log/nginx/fenghuai-wordpress.access.log;
    error_log /var/log/nginx/fenghuai-wordpress.error.log warn;
    client_max_body_size 64m;
    add_header X-Robots-Tag "noindex, nofollow" always;

    # 这是 Headless CMS/询盘测试入口，不对外展示 WordPress 默认主题。
    location = / {
        return 302 /wp-admin/;
    }

    location = /xmlrpc.php {
        return 404;
    }

    location ~ /\. {
        deny all;
    }

    location /wp-content/uploads/ {
        proxy_pass http://127.0.0.1:7081;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    location / {
        proxy_pass http://127.0.0.1:7081;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
