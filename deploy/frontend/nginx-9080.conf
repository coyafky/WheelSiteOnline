# NOTE: `log_format` is only allowed at http scope. Add this line once to
# /etc/nginx/nginx.conf inside the `http { }` block, before including site confs:
#
#   log_format fenghuai_noquery '$remote_addr - $remote_user [$time_local] '
#                               '"$request_method $uri $server_protocol" $status '
#                               '$body_bytes_sent "$http_referer" "$http_user_agent"';
#
# Omitting `$request`/`$request_uri` keeps preview secrets out of the log;
# the URI itself is still recorded, which is all that is needed for triage.
server {
    listen 9080;
    listen [::]:9080;
    server_name 119.91.205.130;

    # Preview links may carry `?secret=...`, and the default `$request` field
    # would write it verbatim. Prefer the `x-fh-preview-secret` header (never
    # logged); this format keeps query strings out of the log entirely.
    access_log /var/log/nginx/fenghuai-frontend-9080.access.log fenghuai_noquery;
    error_log /var/log/nginx/fenghuai-frontend-9080.error.log warn;
    client_max_body_size 2m;
    add_header X-Robots-Tag "noindex, nofollow" always;

    location / {
        proxy_pass http://127.0.0.1:9081;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
